# INACTIVE template; merge with current process definitions only after approval.
app = "daily-backend"
primary_region = "iad"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2"
  understanding = "python -m app.services.understanding_worker"
  events = "python -m app.services.event_worker"

[env]
  S4_WORKER_ENABLED = "false"
  S4_CONSUMERS_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  processes = ["events"]
  size = "shared-cpu-2x"
