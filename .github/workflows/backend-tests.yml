name: backend tests + eval gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # EVAL_OFFLINE=1: every model call must come from the committed cache
      # (evals/.cache/llm). A miss fails the run instead of spending money.
      - name: Run mandatory deterministic S4 contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          paths = sorted(str(path) for path in Path("tests").glob("test_event_*.py")
                         if not path.name.endswith("_postgres.py"))
          paths += sorted(str(path) for path in Path("tests").glob("test_s4_*.py"))
          paths += ["tests/test_eval_event_pipeline.py", "tests/test_global_events.py"]
          subprocess.run([sys.executable, "-m", "pytest", *paths, "-q",
                          "--junitxml=s4-contract-results.xml"], check=True)
          PY
        env:
          EVAL_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Reject missing or skipped deterministic S4 contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse("s4-contract-results.xml").getroot().findall(".//testcase")
          required = {path.stem for path in Path("tests").glob("test_event_*.py")
                      if not path.stem.endswith("_postgres")}
          required |= {path.stem for path in Path("tests").glob("test_s4_*.py")}
          required |= {"test_eval_event_pipeline", "test_global_events"}
          assert required and cases, "S4 deterministic tests were not collected"
          for module in sorted(required):
              selected = [case for case in cases if module in case.get("classname", "").split(".")]
              assert selected, f"No S4 tests executed for {module}"
              assert not any(case.find("skipped") is not None for case in selected), f"Skipped tests in {module}"
          PY
      - name: Run mandatory deterministic S6 contracts without skips
        env:
          EVAL_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          paths = sorted(path for path in Path("tests").glob("test_retrieval_*.py")
                         if not path.name.endswith("_postgres.py"))
          paths += sorted(Path("tests").glob("test_s6_*.py"))
          required = {"test_retrieval_candidates", "test_retrieval_evidence", "test_retrieval_eval",
                      "test_retrieval_runtime", "test_retrieval_handoff", "test_s6_management"}
          assert required <= {path.stem for path in paths}, "S6 modules missing"
          subprocess.run([sys.executable, "-m", "pytest", *map(str, paths), "-q",
                          "--junitxml=s6-contract-results.xml"], check=True)
          cases = ET.parse("s6-contract-results.xml").getroot().findall(".//testcase")
          for module in sorted(required):
              selected = [case for case in cases if module in case.get("classname", "").split(".")]
              assert selected, f"No S6 tests executed for {module}"
              assert not any(case.find("skipped") is not None for case in selected), f"Skipped tests in {module}"
          PY
      - name: Run mandatory deterministic S7 contracts without skips
        env:
          EVAL_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          paths = sorted(path for path in Path("tests").glob("test_ranking_*.py")
                         if not path.name.endswith("_postgres.py"))
          paths += sorted(Path("tests").glob("test_s7_*.py"))
          required = {"test_ranking_repository", "test_ranking_provider", "test_ranking_feedback",
                      "test_ranking_service", "test_ranking_eval", "test_ranking_integration",
                      "test_ranking_events", "test_ranking_build", "test_s7_management"}
          assert required <= {path.stem for path in paths}, "S7 modules missing"
          subprocess.run([sys.executable, "-m", "pytest", *map(str, paths), "-q",
                          "--junitxml=s7-contract-results.xml"], check=True)
          cases = ET.parse("s7-contract-results.xml").getroot().findall(".//testcase")
          for module in sorted(required):
              selected = [case for case in cases if module in case.get("classname", "").split(".")]
              assert selected, f"No S7 tests executed for {module}"
              assert not any(case.find("skipped") is not None for case in selected), f"Skipped tests in {module}"
          PY
      - name: Run mandatory deterministic S8 contracts without skips
        env:
          EVAL_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          paths = sorted(path for path in Path("tests").glob("test_assembly_*.py")
                         if not path.name.endswith("_postgres.py"))
          paths += sorted(Path("tests").glob("test_s8_*.py"))
          required = {"test_assembly_contract", "test_assembly_service", "test_assembly_repository", "test_assembly_adversarial",
                      "test_assembly_integration", "test_assembly_eval", "test_s8_management"}
          assert required <= {path.stem for path in paths}, "S8 modules missing"
          subprocess.run([sys.executable, "-m", "pytest", *map(str, paths), "-q",
                          "--junitxml=s8-contract-results.xml"], check=True)
          cases = ET.parse("s8-contract-results.xml").getroot().findall(".//testcase")
          for module in sorted(required):
              selected = [case for case in cases if module in case.get("classname", "").split(".")]
              assert selected, f"No S8 tests executed for {module}"
              assert not any(case.find("skipped") is not None for case in selected), f"Skipped tests in {module}"
          PY
      # Deterministic invariants do not certify model quality. Independent
      # heldout labels and immutable recipe-bound reports are separate release
      # gates; CI must never fabricate/freeze labels or use EVAL_GATE_STRICT skips.
      - run: EVAL_OFFLINE=1 python -m pytest tests/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # Pure addition: the contract suites above already emit junit XML and it
      # was being discarded. Uploading it on failure as well as success is the
      # difference between "the gate went red" and knowing which subtest did.
      # No existing step's failure behaviour is changed.
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-contract-results-${{ github.sha }}
          path: backend/*-results.xml
          if-no-files-found: warn
          retention-days: 14

  postgres-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EVAL_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      S1_TEST_DATABASE_REQUIRED: "1"
      S2_TEST_DATABASE_REQUIRED: "1"
      S3_TEST_DATABASE_REQUIRED: "1"
      S4_TEST_DATABASE_REQUIRED: "1"
      S6_TEST_DATABASE_REQUIRED: "1"
      S7_TEST_DATABASE_REQUIRED: "1"
      S8_TEST_DATABASE_REQUIRED: "1"
      S1_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      S2_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      S3_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      S4_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      S6_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      S7_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      S8_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify pgvector is installed on the disposable server
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["S3_TEST_DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              version = conn.execute("SELECT extversion FROM pg_extension WHERE extname = 'vector'").fetchone()
              assert version == ("0.8.0",), version
          PY
      - name: Run required S1, S2, S3, S4, S6, S7 and S8 transaction contracts
        run: >-
          python -m pytest tests/test_main_loops_postgres.py
          tests/test_article_content_postgres.py
          tests/test_understanding_postgres.py tests/test_event_postgres.py
          tests/test_event_suppression_loop_postgres.py
          tests/test_retrieval_postgres.py tests/test_ranking_postgres.py
          tests/test_assembly_postgres.py
          -q --junitxml=postgres-results.xml
      - name: Reject skipped or uncollected database suites
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("postgres-results.xml").getroot()
          cases = root.findall(".//testcase")
          for module in ("test_main_loops_postgres", "test_article_content_postgres", "test_understanding_postgres", "test_event_postgres", "test_event_suppression_loop_postgres", "test_retrieval_postgres", "test_ranking_postgres", "test_assembly_postgres"):
              selected = [case for case in cases if module in case.get("classname", "")]
              assert selected, f"No tests executed for {module}"
              assert not any(case.find("skipped") is not None for case in selected), f"Skipped tests in {module}"
          PY
