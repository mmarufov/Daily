name: backend tests + eval gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # EVAL_OFFLINE=1: every model call must come from the committed cache
      # (evals/.cache/llm). A miss fails the run instead of spending money.
      - run: EVAL_OFFLINE=1 python -m pytest tests/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
