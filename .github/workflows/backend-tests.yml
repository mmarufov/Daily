name: backend tests + eval gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # EVAL_OFFLINE=1: every model call must come from the committed cache
      # (evals/.cache/llm). A miss fails the run instead of spending money.
      - run: EVAL_OFFLINE=1 python -m pytest tests/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  postgres-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EVAL_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      S2_TEST_DATABASE_REQUIRED: "1"
      S3_TEST_DATABASE_REQUIRED: "1"
      S2_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      S3_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify pgvector is installed on the disposable server
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["S3_TEST_DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              version = conn.execute("SELECT extversion FROM pg_extension WHERE extname = 'vector'").fetchone()
              assert version == ("0.8.0",), version
          PY
      - name: Run required S2 and S3 transaction contracts
        run: >-
          python -m pytest tests/test_article_content_postgres.py
          tests/test_understanding_postgres.py -q --junitxml=postgres-results.xml
      - name: Reject skipped or uncollected database suites
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("postgres-results.xml").getroot()
          cases = root.findall(".//testcase")
          for module in ("test_article_content_postgres", "test_understanding_postgres"):
              selected = [case for case in cases if module in case.get("classname", "")]
              assert selected, f"No tests executed for {module}"
              assert not any(case.find("skipped") is not None for case in selected), f"Skipped tests in {module}"
          PY
