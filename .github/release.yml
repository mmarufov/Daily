changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: Features ✨
      labels:
        - feat
        - enhancement
    - title: Fixes 🐞
      labels:
        - fix
        - bug
    - title: Feed quality 📊
      labels:
        - feed-quality
    - title: Performance ⚡
      labels:
        - perf
    - title: Documentation 📚
      labels:
        - docs
    - title: Dependencies 📦
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
